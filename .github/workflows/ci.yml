name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.18.0'

      - name: Format check
        run: make fmt

      - name: Run linter
        run: make vetlint

      - name: Run vulnerability scan
        run: make vulncheck

      - name: Run tests
        run: make test

      - name: Run regression tests
        run: make regression-test

      # Cross-version: every PR must pass against both supported TheHive
      # versions. Without this matrix step a regression on 5.5 would
      # silently land because the default `make integration-test` only
      # exercises 5.6.
      - name: Run integration tests against TheHive 5.5
        run: make integration-test-5.5

      - name: Run integration tests against TheHive 5.6
        run: make integration-test-5.6
