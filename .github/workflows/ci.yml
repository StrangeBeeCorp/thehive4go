name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.18.0'

      - name: Format check
        run: make fmt

      - name: Run linter
        run: make vetlint

      - name: Run vulnerability scan
        run: make vulncheck

      - name: Run tests
        run: make test

      - name: Run regression tests
        run: make regression-test

      # The client is generated, then post-processed: a regeneration that
      # skipped a step would bring back the decoders it fixes.
      - name: Check the client is post-processed
        run: make check-postprocess

      # Cross-version: every PR must pass against every supported TheHive
      # version. Without this matrix step a regression on 5.5 would
      # silently land because the default `make integration-test` only
      # exercises 5.6. The client is generated from the 6.0 spec; 5.5, 5.6
      # and 5.8 are older: they catch a response the models do not accept.
      - name: Run integration tests against TheHive 5.5
        run: make integration-test-5.5

      - name: Run integration tests against TheHive 5.6
        run: make integration-test-5.6

      - name: Run integration tests against TheHive 5.8
        run: make integration-test-5.8

      - name: Run integration tests against TheHive 6.0
        run: make integration-test-6.0
